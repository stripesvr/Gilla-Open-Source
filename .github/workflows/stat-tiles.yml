name: Stat tiles

# Redraws the Stars / Forks / Views tiles under the README banner and
# publishes them to the `badges` branch (one commit, replaced each run).

on:
  watch:
    types: [started]
  fork:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/stat_tiles.py
      - .github/workflows/stat-tiles.yml

permissions:
  contents: write

concurrency:
  group: stat-tiles
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Carry over the last state
        run: |
          mkdir tiles
          if git fetch --depth 1 origin badges 2>/dev/null; then
            git show FETCH_HEAD:state.json > tiles/state.json || rm -f tiles/state.json
          fi

      - name: Draw tiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stat_tiles.py tiles

      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd tiles
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update stat tiles"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
